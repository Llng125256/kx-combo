<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>K线复刻监控</title><style>body{background:#111;color:#eee;font-family:Menlo,Consolas,monospace;white-space:pre;padding:12px;font-size:13px;line-height:1.5}</style></head>
<body><div id="c">加载中…</div><script>
(function(){
  var CDN = 'https://cdn.jsdelivr.net/gh/Llng125256/kx-combo@main/status/';
  var SLOTS = ['2330','1730','1130','0530'];
  function pad(n){ return (n<10?'0':'')+n }
  var urls = [];
  for (var off = 0; off <= 2; off++){
    var d = new Date(Date.now() + 8*3600*1000 - off*86400000);
    var key = 'daily-' + pad(d.getMonth()+1) + pad(d.getDate()) + '-';
    SLOTS.forEach(function(s){ urls.push(key + s + '.txt'); });
  }
  var i = 0;
  function next(){
    if (i >= urls.length){ show('最近3天还没有更新（每天05:30/11:30/17:30/23:30更新）'); return; }
    fetch(CDN + urls[i++]).then(function(r){ if(!r.ok) throw 0; return r.text(); })
      .then(function(t){ show(t); })
      .catch(next);
  }
  function show(t){ document.getElementById('c').textContent = t; }
  next();
})();
</script></body></html>
