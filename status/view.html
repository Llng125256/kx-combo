<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>K线复刻监控</title><style>body{background:#111;color:#eee;font-family:Menlo,Consolas,monospace;white-space:pre;padding:12px;font-size:13px;line-height:1.5}</style></head>
<body><div id="c">加载中…</div><script>
(function(){
  var CDN = 'https://cdn.jsdelivr.net/gh/Llng125256/kx-combo@main/status/';
  var API = 'https://api.github.com/repos/Llng125256/kx-combo/contents/status';
  function show(t){ document.getElementById('c').textContent = t; }
  fetch(API).then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(list){
    var names = list.filter(function(f){ return f.name.indexOf('daily-') === 0; })
                    .map(function(f){ return f.name; }).sort().reverse();
    var i = 0;
    function next(){
      if (i >= names.length){ show('今天还没有更新，请稍后再试'); return; }
      fetch(CDN + names[i++]).then(function(r){ if(!r.ok) throw 0; return r.text(); })
        .then(show).catch(next);
    }
    next();
  }).catch(function(){
    // GitHub API 不可达时回退：猜北京时间最近的标准时段
    var now = new Date(Date.now() + 8*3600*1000);
    function pad(n){ return (n<10?'0':'')+n }
    var urls = [];
    for (var off = 0; off <= 1; off++){
      var d = new Date(now.getTime() - off*86400000);
      var key = 'daily-' + pad(d.getMonth()+1) + pad(d.getDate()) + '-';
      ['2330','1730','1130','0530'].forEach(function(s){ urls.push(key + s + '.txt'); });
    }
    var i = 0;
    function next(){
      if (i >= urls.length){ show('加载失败，请稍后再试'); return; }
      fetch(CDN + urls[i++]).then(function(r){ if(!r.ok) throw 0; return r.text(); })
        .then(show).catch(next);
    }
    next();
  });
})();
</script></body></html>
